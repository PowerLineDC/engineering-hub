<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 867 1200" role="img" aria-labelledby="title desc">
<title>Engineering Hub assistant portrait easter egg</title>
<desc>Stylized anime portrait inspired by the green-haired character reference at Avavatar image 48700.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#dff7ff"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075f4f"/><stop offset=".48" stop-color="#18a878"/><stop offset="1" stop-color="#8ee8b5"/></linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d8e4ee"/></linearGradient>
</defs>
<rect width="867" height="1200" fill="url(#sky)"/>
<circle cx="720" cy="150" r="92" fill="#fff8c7" opacity=".7"/>
<path d="M0 880 Q180 790 350 860 T867 835 V1200 H0Z" fill="#55b9a1" opacity=".55"/>
<path d="M0 950 Q190 860 380 950 T867 925 V1200 H0Z" fill="#197d72" opacity=".55"/>

<!-- long green hair -->
