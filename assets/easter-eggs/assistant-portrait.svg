<path d="M432 708 L395 804 L432 851 L469 804Z" fill="#35a984"/>
<path d="M204 878 Q432 956 662 878" fill="none" stroke="#b5c8d5" stroke-width="10" opacity=".8"/>

<!-- subtle assistant mark -->
<circle cx="432" cy="1050" r="58" fill="#0b3d35" opacity=".9"/>
<path d="M404 1050 L420 1034 L432 1046 L444 1034 L460 1050 L444 1066 L432 1054 L420 1066Z" fill="#a5f3d0"/>
