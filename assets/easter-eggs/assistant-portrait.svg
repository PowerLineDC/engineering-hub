<!-- eyes -->
<ellipse cx="352" cy="441" rx="34" ry="43" fill="#fff"/><ellipse cx="514" cy="441" rx="34" ry="43" fill="#fff"/>
<ellipse cx="358" cy="448" rx="16" ry="25" fill="#177d68"/><ellipse cx="508" cy="448" rx="16" ry="25" fill="#177d68"/>
<circle cx="364" cy="438" r="6" fill="#fff"/><circle cx="514" cy="438" r="6" fill="#fff"/>
<path d="M397 531 Q438 559 481 531" fill="none" stroke="#a64d59" stroke-width="9" stroke-linecap="round"/>

<!-- hair side strands -->
