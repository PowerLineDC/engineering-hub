<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#211a2a"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#020204"/><stop offset=".45" stop-color="#17131c"/><stop offset=".7" stop-color="#050507"/><stop offset="1" stop-color="#211b25"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0e8"/><stop offset=".65" stop-color="#e7c5bb"/><stop offset="1" stop-color="#c79691"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a334f"/><stop offset=".48" stop-color="#251a2b"/><stop offset="1" stop-color="#09090e"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#d9c8e8" stop-opacity=".22"/><stop offset="1" stop-color="#d9c8e8" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="900" height="1400" fill="url(#bg)"/>
